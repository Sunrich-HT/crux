[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crux-supervisor"
version = "0.1.0"
description = "A deterministic disclosure-policy core for evidence-governed thinking agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Crux contributors" }]
keywords = ["ai", "socratic", "research", "decision-support", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
crux = "crux_supervisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crux_supervisor"]

